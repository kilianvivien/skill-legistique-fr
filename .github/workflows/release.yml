name: Release

# Publier une version : mettre à jour la version dans legistique-fr/SKILL.md, écrire
# distribution/notes/vX.Y.Z.md (première ligne « # titre », puis les notes), fusionner dans main,
# attendre que les tests passent sur main (ils ne sont pas relancés ici), puis pousser l'étiquette :
# git tag vX.Y.Z && git push origin vX.Y.Z
# Sans pousser d'étiquette : onglet Actions, « Release », « Run workflow » sur main. L'étiquette est
# tirée de la version de SKILL.md et créée avec la release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publier la release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: L'étiquette correspond à la version de la skill
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^ *version: "\(.*\)"$/\1/p' legistique-fr/SKILL.md | head -1)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Lancer la publication manuelle depuis main"
              exit 1
            fi
            if gh release view "v$version" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "v$version" > /dev/null; then
              echo "::error::v$version existe déjà : mettre à jour la version dans SKILL.md"
              exit 1
            fi
          elif [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Étiquette $GITHUB_REF_NAME, mais SKILL.md annonce la version $version"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Construire les archives
        run: bash scripts/build-zip.sh
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Étiquette poussée : elle existe déjà. Lancement manuel : gh la crée sur le commit testé.
          notes="distribution/notes/$TAG.md"
          if [ -f "$notes" ]; then
            titre="$(head -1 "$notes" | sed 's/^# *//')"
            tail -n +2 "$notes" | sed '/./,$!d' > corps.md
            set -- --title "$titre" --notes-file corps.md
          else
            set -- --title "$TAG" --generate-notes
          fi
          gh release create "$TAG" legistique-fr.zip legistique-fr.skill --target "$GITHUB_SHA" "$@"
